name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main   # change if your branch is different

# 🔥 Fix for Node.js 24 migration
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. Install Node (if needed)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 4. Install dependencies (if using React/Vite/etc.)
      - name: Install dependencies
        run: npm install

      # 5. Build project (skip if static HTML)
      - name: Build project
        run: npm run build

      # 6. Upload build files
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./dist   # change if your build folder is different

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # 7. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
