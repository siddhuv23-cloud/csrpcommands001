name: Deploy Final Fix

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ✅ Create clean folder (VERY IMPORTANT)
      - name: Prepare clean build
        run: |
          mkdir public
          cp -r frontend/* public/

          # Remove hidden/problem files
          rm -rf public/.git
          rm -rf public/.github
          rm -rf public/node_modules
          find public -name ".DS_Store" -delete

      # ✅ Upload ONLY clean files
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./public

      - name: Deploy
        uses: actions/deploy-pages@v4
