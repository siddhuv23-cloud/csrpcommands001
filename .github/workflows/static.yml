name: Deploy Final Clean

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # ✅ Create CLEAN folder with ONLY valid files
      - name: Create clean site
        run: |
          mkdir public

          # Copy only safe file types
          find frontend -type f \( \
            -name "*.html" -o \
            -name "*.css" -o \
            -name "*.js" -o \
            -name "*.png" -o \
            -name "*.jpg" -o \
            -name "*.jpeg" -o \
            -name "*.gif" -o \
            -name "*.svg" \
          \) -exec cp --parents {} public/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./public

      - uses: actions/deploy-pages@v4
