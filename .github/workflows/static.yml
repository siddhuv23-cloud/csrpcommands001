name: Deploy Clean Frontend

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ✅ Clean unwanted files before upload
      - name: Clean frontend
        run: |
          rm -rf frontend/.git
          rm -rf frontend/node_modules
          rm -rf frontend/.github

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./frontend

      - name: Deploy
        uses: actions/deploy-pages@v4
